# Tracked git configuration. Stowed to ~/.config/git/tracked.conf.
#
# ~/.config/git/config is deliberately a small REAL file that `include`s this
# one, because `git config --global ...` rewrites its target via lockfile+rename
# and would silently replace a stow symlink with a regular file.
# Edit this file directly; use `git config --global` only for machine-local bits.

[user]
	name = Thiago Madureira Braga
	email = thiago@thau.tech

[init]
	defaultBranch = main

[core]
	editor = nvim
	excludesFile = ~/.config/git/ignore
	pager = delta

[interactive]
	diffFilter = delta --color-only

[delta]
	navigate = true          ; n / N jump between diff hunks
	line-numbers = true
	side-by-side = false     ; calmer, and works in narrow panes
	hyperlinks = true
	syntax-theme = ansi

[merge]
	conflictstyle = zdiff3   ; shows the common ancestor, far easier to resolve
	tool = nvimdiff

[diff]
	colorMoved = default
	algorithm = histogram
	mnemonicPrefix = true
	renames = copies

[pull]
	rebase = true

[push]
	default = simple
	autoSetupRemote = true   ; no more "--set-upstream" dance
	followTags = true

[fetch]
	prune = true
	pruneTags = true
	writeCommitGraph = true

[rebase]
	autoStash = true
	autoSquash = true
	updateRefs = true

[rerere]
	enabled = true           ; remember conflict resolutions and replay them
	autoUpdate = true

[branch]
	sort = -committerdate

[tag]
	sort = version:refname

[column]
	ui = auto

[status]
	showUntrackedFiles = all
	submoduleSummary = true

[log]
	date = iso

[commit]
	verbose = true           ; show the full diff in the commit message editor

[help]
	autocorrect = prompt

[alias]
	st = status -sb
	co = checkout
	sw = switch
	br = branch
	ci = commit
	last = log -1 --stat
	amend = commit --amend --no-edit
	undo = reset --soft HEAD~1
	unstage = restore --staged
	lg = log --graph --abbrev-commit --decorate --date=relative --format=format:'%C(bold blue)%h%C(reset) %C(dim white)%an%C(reset) %C(bold green)(%ar)%C(reset)%C(auto)%d%C(reset)%n        %C(white)%s%C(reset)'
	ll = log --oneline --graph --decorate
	wip = commit -am "wip"
	aliases = config --get-regexp ^alias\\.
